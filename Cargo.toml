[workspace]
resolver = "2"
members = [
  "crates/wallhaven-core",
  "crates/wallhaven-desktop",
]

[workspace.package]
# Package names are defined in each crate's own Cargo.toml.
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
authors = ["Wallhaven Desktop contributors"]

[workspace.dependencies]
dirs = "6.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "native-tls"] }
dioxus = { version = "0.7.3", features = ["desktop"] }
async-trait = "0.1"
